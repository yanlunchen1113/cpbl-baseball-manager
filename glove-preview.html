const T=THREE,area=document.getElementById('view'),renderer=new T.WebGLRenderer({antialias:true});renderer.setPixelRatio(Math.min(devicePixelRatio,1.5));renderer.shadowMap.enabled=true;renderer.shadowMap.type=T.PCFSoftShadowMap;renderer.outputColorSpace=T.SRGBColorSpace;renderer.toneMapping=T.ACESFilmicToneMapping;renderer.toneMappingExposure=1.15;renderer.domElement.setAttribute('aria-label','Blender 手套三維模型');area.append(renderer.domElement);const scene=new T.Scene();scene.background=new T.Color('#202a30');const camera=new T.PerspectiveCamera(33,1,.01,10);camera.position.set(.07,.10,.80);camera.lookAt(0,.04,.025);scene.add(new T.HemisphereLight('#d9e8f7','#65523d',1.6));const light=new T.DirectionalLight('#fff1dd',2.4);light.position.set(-.5,.7,1);light.castShadow=true;light.shadow.mapSize.set(2048,2048);Object.assign(light.shadow.camera,{left:-.4,right:.4,top:.4,bottom:-.4,near:.01,far:3});light.shadow.bias=-.00015;light.shadow.normalBias=.0018;scene.add(light);const fill=new T.DirectionalLight('#b5cfff',.8);fill.position.set(.8,.2,-1);scene.add(fill);let a,kind='';CPBLGloves.load(T);function loop(){if(kind!==document.getElementById('type').value){if(a)scene.remove(a.glove);kind=document.getElementById('type').value;a={kind,glove:new T.Group()};scene.add(a.glove);}CPBLGloves.apply(T,a);const u=+document.getElementById('close').value/100;a.glove.rotation.y=+document.getElementById('turn').value*Math.PI/180;for(const mesh of a.glove.userData.foldMeshes||[]){mesh.morphTargetInfluences[0]=u<=.5?u*2:2*(1-u);mesh.morphTargetInfluences[1]=u<=.5?0:u*2-1;}document.getElementById('status').textContent=a.glove.userData.blenderAsset?'Blender GLB · '+(u===0?'張開':u===1?'夾合':'夾合 '+Math.round(u*100)+'%'):'載入 Blender GLB…';const w=area.clientWidth,h=area.clientHeight;renderer.setSize(w,h,false);camera.aspect=w/h;camera.updateProjectionMatrix();renderer.render(scene,camera);requestAnimationFrame(loop);}document.getElementById('front').onclick=()=>document.getElementById('turn').val
